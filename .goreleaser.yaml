version: 2
project_name: sing-box
builds:
  - &template
    id: main
    main: ./cmd/sing-box
    flags:
      - -v
      - -trimpath
    ldflags:
      - -X github.com/sagernet/sing-box/constant.Version={{ .Version }}
      - -s
      - -buildid=
      - -checklinkname=0
    tags:
      - with_gvisor
      - with_quic
      - with_dhcp
      - with_wireguard
      - with_utls
      - with_acme
      - with_clash_api
      - with_tailscale
      - with_masque
      - with_mtproxy
      - with_openvpn
      - with_trusttunnel
      - with_call
      - with_sudoku
      - with_snell
      - with_manager
      - with_admin_panel
      - with_profiler
      - badlinkname
      - tfogo_checklinkname0
    env:
      - CGO_ENABLED=0
      - GOTOOLCHAIN=local
    targets:
      - linux_386
      - linux_amd64_v1
      - linux_arm64
      - linux_arm_6
      - linux_arm_7
      - linux_s390x
      - linux_riscv64
      - windows_amd64_v1
      - windows_386
      - windows_arm64
      - darwin_amd64_v1
      - darwin_arm64
    mod_timestamp: '{{ .CommitTimestamp }}'
  - id: mips
    <<: *template
    tags:
      - with_gvisor
      - with_quic
      - with_dhcp
      - with_wireguard
      - with_utls
      - with_acme
      - with_clash_api
      - with_tailscale
      - with_masque
      - with_mtproxy
      - with_openvpn
      - with_trusttunnel
      - with_call
      - with_sudoku
      - with_snell
      - with_profiler
      - badlinkname
      - tfogo_checklinkname0
    targets:
      - linux_mips
      - linux_mips_softfloat
      - linux_mipsle
      - linux_mipsle_softfloat
      - linux_mips64
      - linux_mips64le
  - id: android
    <<: *template
    env:
      - CGO_ENABLED=1
      - GOTOOLCHAIN=local
    overrides:
      - goos: android
        goarch: arm
        goarm: 7
        env:
          - CC=armv7a-linux-androideabi21-clang
          - CXX=armv7a-linux-androideabi21-clang++
      - goos: android
        goarch: arm64
        env:
          - CC=aarch64-linux-android21-clang
          - CXX=aarch64-linux-android21-clang++
      - goos: android
        goarch: 386
        env:
          - CC=i686-linux-android21-clang
          - CXX=i686-linux-android21-clang++
      - goos: android
        goarch: amd64
        goamd64: v1
        env:
          - CC=x86_64-linux-android21-clang
          - CXX=x86_64-linux-android21-clang++
    targets:
      - android_arm_7
      - android_arm64
      - android_386
      - android_amd64
  - id: naive-purego-linux-amd64
    <<: *template
    tags:
      - with_gvisor
      - with_quic
      - with_dhcp
      - with_wireguard
      - with_utls
      - with_acme
      - with_clash_api
      - with_tailscale
      - with_masque
      - with_mtproxy
      - with_openvpn
      - with_trusttunnel
      - with_call
      - with_sudoku
      - with_snell
      - with_manager
      - with_admin_panel
      - with_profiler
      - badlinkname
      - tfogo_checklinkname0
      - with_naive_outbound
      - with_purego
    env:
      - CGO_ENABLED=0
      - GOTOOLCHAIN=local
    hooks:
      post:
        - cmd: go run -C {{ .Env.CRONET_GO_PATH }} ./cmd/build-naive extract-lib --target {{ .Os }}/{{ .Arch }} -o {{ dir .Path }}
          env:
            - CGO_ENABLED=0
    targets:
      - linux_amd64_v1
  - id: naive-purego-linux-arm64
    <<: *template
    tags:
      - with_gvisor
      - with_quic
      - with_dhcp
      - with_wireguard
      - with_utls
      - with_acme
      - with_clash_api
      - with_tailscale
      - with_masque
      - with_mtproxy
      - with_openvpn
      - with_trusttunnel
      - with_call
      - with_sudoku
      - with_snell
      - with_manager
      - with_admin_panel
      - with_profiler
      - badlinkname
      - tfogo_checklinkname0
      - with_naive_outbound
      - with_purego
    env:
      - CGO_ENABLED=0
