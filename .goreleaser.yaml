      - with_acme
      - with_clash_api
      - with_tailscale
      - with_masque
      - with_mtproxy
      - with_openvpn
      - with_trusttunnel
      - with_call
      - with_sudoku
      - with_snell
      - with_manager
      - with_admin_panel
