    hooks:
      post:
        - cmd: go run -C {{ .Env.CRONET_GO_PATH }} ./cmd/build-naive extract-lib --target {{ .Os }}/{{ .Arch }} -o {{ dir .Path }}
          env:
            - CGO_ENABLED=0
    targets:
      - linux_arm64
  - id: naive-purego-windows-amd64
    <<: *template
    tags:
      - with_gvisor
      - with_quic
      - with_dhcp
      - with_wireguard
